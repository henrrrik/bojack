version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/bojack
    binary: bojack
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md: the release workflow passes that
# version's section with --release-notes. Don't set changelog.disable, which
# also drops the --release-notes file (v0.1.0 went out with empty notes).
