version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the Charm libraries, which move together.
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
          - "github.com/NimbleMarkets/ntcharts/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
